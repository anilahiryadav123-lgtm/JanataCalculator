name: Build Janata Calculator APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          echo "Repo files:"; ls -la
          F=$(find . -name index.html -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then
            Z=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
            if [ -n "$Z" ]; then unzip -o "$Z" -d unzipped; F=$(find unzipped -name index.html | head -1); fi
          fi
          if [ -z "$F" ]; then echo "ERROR: index.html repo me nahi mila"; exit 1; fi
          D=$(dirname "$F"); echo "App files: $D"
          mkdir -p www
          cp -r "$D"/. www/
          rm -rf www/.github www/.git
          ls -la www

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap init "Janata Calculator" com.anilyadav.janatacalculator --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          if [ ! -f www/icons/icon-48.png ]; then echo "icons nahi mile, default icon"; exit 0; fi
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            cp www/icons/icon-$s.png $R/mipmap-$n/ic_launcher.png
            cp www/icons/icon-$s.png $R/mipmap-$n/ic_launcher_round.png
            cp www/icons/icon-$s.png $R/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../JanataCalculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JanataCalculator-APK
          path: JanataCalculator.apk
